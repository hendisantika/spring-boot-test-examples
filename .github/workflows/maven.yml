# Build & test every Spring Boot example module with Maven on JDK 25.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # required to submit the dependency graph snapshot
    strategy:
      fail-fast: false
      matrix:
        module:
          - spring-boot-datajpatest
          - spring-boot-integration-testing
          - spring-boot-jsontest
          - spring-boot-unit-testing
          - spring-boot-webclient-mockwebserver
          - spring-boot-webmvctest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml

      - name: Build & test ${{ matrix.module }}
        run: mvn -B -ntp verify --file ./${{ matrix.module }}/pom.xml

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.module }}
          path: ${{ matrix.module }}/target/surefire-reports/
          retention-days: 7

      # Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts
      - name: Update dependency graph
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
        with:
          directory: ${{ matrix.module }}
          ignore-maven-wrapper: true
          correlator: ${{ github.job }}-${{ matrix.module }}
